<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - AgaTage</title>
</head>
<body>

    <!-- ヘッダー領域 -->
    <header>
        <div class="header-top">
            <h1>AgaTage</h1>
            <div class="language-switch">
            <!-- JPを押すと日本語版へ、ENを押すと英語版へ移動 -->
            <a href="contact.html">JP</a> / <a href="contact-en.html">EN</a>
            </div>
        </div>
        
        <nav class="main-nav">
            <ul>
                <li><a href="index-en.html">Top</a></li>
                <li><a href="app-en.html">App Info</a></li>
                <li><a href="contact-en.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- メインコンテンツ領域 -->
    <section class="contact-section">
    <p>If you have any questions, feedback, or bug reports regarding MusicQuiz, please feel free to contact us using the form below.</p>
    
    <!-- オリジナルのHTMLフォーム -->
    <form action="https://formspree.io/f/xgavvbaa" method="POST" class="custom-form">
        
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. John Doe" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="e.g. info@example.com" required>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" placeholder="Please enter the details of your inquiry." required></textarea>
        </div>

        <div class="form-submit">
            <button type="submit" class="btn-send">Send Message</button>
        </div>

    </form>
    </section>

    <!-- フッター領域 -->
    <footer>
        <nav class="footer-nav">
            <ul>
                <li><a href="index-en.html">Top</a></li>
                <li><a href="app-en.html">App Info</a></li>
                <li><a href="contact-en.html">Contact</a></li>
                <li><a href="privacy-en.html">Privacy Policy</a></li>
            </ul>
        </nav>
        <p>&copy; 2026 AgaTage</p>
    </footer>

</body>
</html>
