<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ - AgaTage</title>
</head>
<body>

    <!-- ヘッダー領域 -->
    <header>
        <div class="header-top">
            <h1>AgaTage</h1>
            <div class="language-switch">
            <!-- JPを押すと日本語版へ、ENを押すと英語版へ移動 -->
            <a href="contact.html">JP</a> / <a href="contact-en.html">EN</a>
            </div>
        </div>
        
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Top</a></li>
                <li><a href="app.html">アプリ紹介</a></li>
                <li><a href="contact.html">お問い合わせ</a></li>
            </ul>
        </nav>
    </header>

    <!-- メインコンテンツ領域 -->
    <section class="contact-section">
    <p>MusicQuizに関するご質問、ご要望、不具合のご報告などは、以下のフォームよりお気軽にお寄せください。</p>
    
    <!-- オリジナルのHTMLフォーム -->
    <!-- ※ action="ここのURL" は後で設定します -->
    <form action="https://formspree.io/f/xgavvbaa" method="POST" class="custom-form">
        
        <div class="form-group">
            <label for="name">お名前</label>
            <input type="text" id="name" name="name" placeholder="例：山田 太郎" required>
        </div>

        <div class="form-group">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" placeholder="例：info@example.com" required>
        </div>

        <div class="form-group">
            <label for="message">お問い合わせ内容</label>
            <textarea id="message" name="message" rows="6" placeholder="具体的な内容をご記入ください。" required></textarea>
        </div>

        <div class="form-submit">
            <button type="submit" class="btn-send">送信する</button>
        </div>

    </form>
</section>

    <!-- フッター領域 -->
    <footer>
        <nav class="footer-nav">
            <ul>
                <li><a href="index.html">Top</a></li>
                <li><a href="app.html">アプリ紹介</a></li>
                <li><a href="contact.html">お問い合わせ</a></li>
                <li><a href="privacy.html">プライバシーポリシー</a></li>
            </ul>
        </nav>
        <p>&copy; 2026 AgaTage</p>
    </footer>

</body>
</html>
